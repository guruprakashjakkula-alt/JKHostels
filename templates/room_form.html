{% extends "base.html" %}
{% block content %}
<div class="page-header">
    <h1>Add New Room</h1>
</div>
<div class="card">
    <form method="POST" action="{{ url_for('room_add') }}" class="form-grid">
        <div class="form-group">
            <label>Room Number</label>
            <input type="text" name="room_number" required class="form-control">
        </div>
        <div class="form-group">
            <label>Room Type</label>
            <select name="room_type" class="form-control">
                <option value="Single">Single</option>
                <option value="Double">Double</option>
                <option value="Triple">Triple</option>
            </select>
        </div>
        <div class="form-group">
            <label>Capacity</label>
            <input type="number" name="capacity" value="1" required class="form-control">
        </div>
        <div class="form-group">
            <label>Monthly Rent</label>
            <input type="number" step="0.01" name="monthly_rent" required class="form-control">
        </div>
        <div class="form-actions full-width">
            <button type="submit" class="btn btn-primary">Save Room</button>
        </div>
    </form>
</div>
{% endblock %}
