{% extends "base.html" %}
{% block content %}
<div class="page-header">
    <h1>Student Management</h1>
    <a href="{{ url_for('student_add') }}" class="btn btn-primary"><i class="fas fa-plus"></i> Add Student</a>
</div>
<div class="card">
    <div class="table-controls">
        <input type="text" id="searchInput" placeholder="Search students..." class="form-control">
    </div>
    <table class="data-table" id="dataTable">
        <thead>
            <tr>
                <th>Student ID</th>
                <th>Full Name</th>
                <th>Email</th>
                <th>Phone</th>
                <th>Status</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for student in students %}
            <tr>
                <td>{{ student.student_id }}</td>
                <td>{{ student.full_name }}</td>
                <td>{{ student.email }}</td>
                <td>{{ student.phone }}</td>
                <td><span class="badge badge-success">{{ student.status }}</span></td>
                <td>
                    <a href="#" class="btn-icon text-primary"><i class="fas fa-eye"></i></a>
                    <a href="{{ url_for('student_delete', id=student.id) }}" class="btn-icon text-danger" onclick="return confirm('Delete this student?');"><i class="fas fa-trash"></i></a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
